[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-agent-span-tracer"
version = "0.1.0"
description = "Records nested causal DAGs of reasoning steps, tool invocations, memory reads, and critical-path latency"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
causal-agent-span-tracer = "causal_agent_span_tracer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["causal_agent_span_tracer*"]
